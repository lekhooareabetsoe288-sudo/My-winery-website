<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart | Your Winery Name</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body><div id="site-header"></div>
<div class="page-title"><div class="wrap"><h1>Your cart</h1></div></div>
<section><div class="wrap"><div id="cart-items"></div><p class="total" id="cart-total"></p>
<form id="checkout"><h2>Your details</h2><label for="c-name">Full name</label><input id="c-name" required>
<label for="c-phone">Phone number</label><input id="c-phone" type="tel" required>
<label for="c-addr">Delivery address</label><textarea id="c-addr" rows="3" required></textarea>
<p class="note">You must be 18 or older. Clicking the button opens WhatsApp with your order ready to send. We reply to confirm payment and delivery.</p>
<button class="btn" type="submit">Send order on WhatsApp</button></form></div></section>
<div id="site-footer"></div><script src="script.js"></script></body></html>
