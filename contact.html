<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Your Winery Name</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body><div id="site-header"></div>
<div class="page-title"><div class="wrap"><h1>Contact us</h1><p>Questions, bulk orders or events? Write to us.</p></div></div>
<section><div class="wrap split"><form id="contact-form"><label for="f-name">Your name</label><input id="f-name" required>
<label for="f-phone">Phone number</label><input id="f-phone" type="tel">
<label for="f-subject">Subject</label><select id="f-subject"><option>Order enquiry</option><option>Bulk or event order</option><option>Other</option></select>
<label for="f-msg">Message</label><textarea id="f-msg" rows="5" required></textarea><p><button class="btn" type="submit">Send message</button></p></form>
<div><h2>Find us</h2><p>Edit your address, phone, email and WhatsApp at the top of script.js and every page updates.</p>
<p class="note">The form opens your email app with the message ready to send. A server-side form comes in the backend stage.</p></div></div></section>
<div id="site-footer"></div><script src="script.js"></script></body></html>
